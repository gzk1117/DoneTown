name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

jobs:
  build-debug-apk:
    name: Build DoneTown debug APK
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}\android-sdk
      ANDROID_HOME: ${{ runner.temp }}\android-sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cmdToolsZip = Join-Path $env:RUNNER_TEMP "commandlinetools-win.zip"
          $cmdToolsExtract = Join-Path $env:RUNNER_TEMP "commandlinetools"
          $cmdToolsParent = Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools"
          $cmdToolsLatest = Join-Path $cmdToolsParent "latest"

          New-Item -ItemType Directory -Force -Path $env:ANDROID_SDK_ROOT | Out-Null
          New-Item -ItemType Directory -Force -Path $cmdToolsParent | Out-Null
          New-Item -ItemType Directory -Force -Path $cmdToolsExtract | Out-Null
          Invoke-WebRequest `
            -Uri "https://dl.google.com/android/repository/commandlinetools-win-14742923_latest.zip" `
            -OutFile $cmdToolsZip
          tar -xf $cmdToolsZip -C $cmdToolsExtract
          Move-Item -LiteralPath (Join-Path $cmdToolsExtract "cmdline-tools") -Destination $cmdToolsLatest

          $sdkmanager = Join-Path $cmdToolsLatest "bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $sdkmanager --sdk_root=$env:ANDROID_SDK_ROOT --licenses
          & $sdkmanager --sdk_root=$env:ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        shell: powershell
        run: npm run apk:debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DoneTown-debug-apk
          path: dist-apk/DoneTown-debug.apk
          if-no-files-found: error
          retention-days: 14
